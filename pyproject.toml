[project]
name = "youtube-voice-replacement"
version = "0.2.0"
description = "Replace YouTube video audio with AI-generated TTS speech"
requires-python = ">=3.11"
dependencies = [
    "decorator==4.4.2",
    "ffmpeg-python>=0.2.0",
    "google-cloud-texttospeech>=2.27.0",
    "google-cloud-speech>=2.33.0",
    "imageio-ffmpeg>=0.6.0",
    "imageio==2.34.0",
    "moviepy>=2.2.1",
    "pydub>=0.25.1",
    "streamlit>=1.48.1",
    "yt-dlp>=2025.8.20",
    "youtube-transcript-api>=3.2.1",
    "ffmpeg>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"